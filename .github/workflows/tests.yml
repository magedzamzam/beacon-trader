name: tests

# The core engine is pure-Python and unit-testable without a DB/Redis/broker
# (see packages/core/tests). Several agents change this repo, so the suite runs
# on every push/PR to catch regressions in sizing, guards, SL rules, and the
# analysis layer before they reach the trading path.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: core engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install beacon-core + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core
          pip install pytest
          # fastapi + pydantic, so services/api/tests can import the real routers
          # rather than a shim (#165). No DB/Redis needed — those tests are pure.
          pip install -r services/api/requirements.txt

      - name: Run test suite
        # packages/core/tests  -> sizing, guards, SL ladder, bayes, TA, structure,
        #                        estimators, reconcile, bus, ingest, notifications
        # services/executor/tests -> exercises the real beacon_core execution guard
        # services/api/tests   -> write-side validation for the Entry/Filtration/Exit
        #                        pillars: what config is allowed to reach the DB and
        #                        therefore the executor and monitor (#165)
        # services/replay/tests -> the offline replay harness (#169). Includes the
        #                        import-graph test proving no order-placing symbol is
        #                        reachable from it — the isolation the operator asked
        #                        for is enforced in CI, not described in a docstring.
        run: >
          pytest packages/core/tests services/executor/tests services/api/tests
          services/replay/tests -q

# Beacon Trader — service topology.
# PostgreSQL is external/managed (set DATABASE_URL in .env). Redis is the
# in-cluster bus + heartbeat store. Workers expose /health on :8080.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args:
        # Build provenance (#218). Empty default so a plain `docker compose build`
        # still works; pass it to record the commit:
        #   GIT_SHA=$(git rev-parse HEAD) docker compose build api executor monitor telegram
        GIT_SHA: "${GIT_SHA:-}"
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  telegram:
    build:
      context: .
      dockerfile: services/telegram/Dockerfile
      args:
        GIT_SHA: "${GIT_SHA:-}"                                    # (#218)
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  executor:
    build:
      context: .
      dockerfile: services/executor/Dockerfile
      args:
        GIT_SHA: "${GIT_SHA:-}"                                    # (#218)
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  monitor:
    build:
      context: .
      dockerfile: services/monitor/Dockerfile
      args:
        GIT_SHA: "${GIT_SHA:-}"                                    # (#218)
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  # Keeps `public.candles` current (#224). It is a SERVICE and not a habit: the
  # store went 15 days stale because `scripts/candle_sync.py` was run by hand on
  # 2026-08-03 and then never again, which silently blocked BOTH the #182/#187
  # excursion ladder and any forward test of the offline generator.
  #
  # Deliberately its own container rather than a task inside `monitor`: a
  # catch-up pass is thousands of bars of broker API, and `monitor` manages OPEN
  # POSITIONS on a tick loop against the same rate limit. It reuses the api image
  # (same deps, no second build) and touches nothing on the trading path -- it
  # only INSERTs candles, ON CONFLICT DO NOTHING.
  candle-sync:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args:
        GIT_SHA: "${GIT_SHA:-}"                                    # (#218)
    restart: unless-stopped
    env_file: .env
    command: ["python", "/app/scripts/candle_sync.py", "--loop", "1800"]
    # Override the api image's HTTP probe -- this container serves no port. The
    # health that matters here is the STORE's freshness, not the process's
    # liveness: a probe on "is it running?" would have been green through the
    # whole 15-day stall, because nothing was running it at all. 90 min allows
    # two missed 30-min passes before it goes red, and the check treats the
    # weekend market close as healthy rather than crying wolf every Saturday.
    healthcheck:
      test: ["CMD", "python", "/app/scripts/candle_sync.py", "--healthcheck", "90"]
      interval: 10m
      timeout: 30s
      start_period: 2m
      retries: 2
    depends_on:
      redis:
        condition: service_healthy

  # Lever 5's shadow producer (#224). Runs every enabled `kind='engine'` source
  # against the newest CLOSED bar and writes a `status='shadow'` signal when the
  # strategy triggers.
  #
  # It CANNOT place an order. A signal reaches the executor exactly once, by
  # being enqueued onto the durable queue in ingest/pipeline.py; this process
  # neither imports the bus nor enqueues anything, and a test asserts that over
  # the module's AST. `enabled_for_trading=false` on the source is the second,
  # independent guard.
  #
  # It reads candles from our own store rather than the broker, so unlike
  # candle-sync it costs no rate limit and can run often. 5 minutes against a
  # 15m trigger bar means a signal is written within a few minutes of the bar
  # closing; the bar-close stamp makes the exact cadence irrelevant to the
  # ledger. Idle until an engine source exists.
  engine-producer:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args:
        GIT_SHA: "${GIT_SHA:-}"                                    # (#218)
    restart: unless-stopped
    env_file: .env
    command: ["python", "/app/scripts/engine_producer.py", "--loop", "300"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 10m
      timeout: 20s
      start_period: 1m
      retries: 2
    depends_on:
      redis:
        condition: service_healthy

  # Offline replay + backtest harness (#169). RESEARCH, not trading.
  #
  # Deliberately different from every service above, and each difference is the
  # isolation the operator asked for:
  #   * `profiles: [research]` — `docker compose up -d` does NOT start it. It is
  #     run explicitly:  docker compose run --rm replay python main.py run --config ...
  #     A service that is not running cannot disturb one that is, and
  #     `docker compose stop replay` is trivially a no-op on trading.
  #   * an explicit `environment:` block instead of `env_file: .env` — the
  #     Capital.com credentials are not in this container's environment at all.
  #   * REPLAY_DATABASE_URL, a SELECT-only role (services/replay/sql/replay_role.sql).
  #     It is NOT given DATABASE_URL.
  #   * no `depends_on: redis` — it never touches the bus, the durable queue or
  #     CH_SIGNAL_VALID.
  #   * cpu/memory ceilings, because `monitor` manages OPEN POSITIONS on a tick
  #     loop against the same box and must win every scheduling contest.
  replay:
    profiles: ["research"]
    build:
      context: .
      dockerfile: services/replay/Dockerfile
      args:
        # Baked into the image so a stored run can name the code that made it.
        # Empty is tolerated and reported, never guessed:
        #   GIT_SHA=$(git rev-parse HEAD) docker compose build replay
        GIT_SHA: "${GIT_SHA:-}"
    restart: "no"
    environment:
      REPLAY_DATABASE_URL: ${REPLAY_DATABASE_URL}
    volumes:
      - ./services/replay/runs:/app/runs
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # The ONE long-running piece of the research half (#183). It exists so the
  # portal can drive backtesting without an SSH session, and it keeps every
  # isolation property the batch job had: no broker credentials, a SELECT-only
  # role on the trading schema, writes confined to `replay.*`, `nice -19` from
  # the image ENTRYPOINT, and a hard CPU/memory ceiling. It drains a queue one
  # job at a time, so N impatient clicks are N queued jobs, not N sweeps
  # competing with `monitor` for the box that manages open positions.
  #
  # NOT behind the `research` profile: a queue with no consumer is a portal
  # whose Launch button silently does nothing.
  replay-worker:
    build:
      context: .
      dockerfile: services/replay/Dockerfile
      args:
        GIT_SHA: "${GIT_SHA:-}"
    restart: unless-stopped
    command: ["python", "main.py", "worker"]
    environment:
      REPLAY_DATABASE_URL: ${REPLAY_DATABASE_URL}
    volumes:
      - ./services/replay/runs:/app/runs
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  redis-data:
